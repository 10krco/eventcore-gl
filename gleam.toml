name = "eventcore"
version = "1.0.0"
target = "erlang"
description = "Multi-stream event sourcing for Gleam on Erlang/OTP"
licences = ["MIT"]
repository = { type = "github", user = "10krco", repo = "eventcore-gl" }

[documentation]
pages = [
  { title = "Commands and atomic transfers", path = "commands.html", source = "docs/commands.md" },
  { title = "Projections and recovery", path = "projections.html", source = "docs/projections.md" },
  { title = "Storage backends", path = "backends.html", source = "docs/backends.md" },
  { title = "Testing", path = "testing.html", source = "docs/testing.md" },
]

[dev-dependencies]
gleeunit = ">= 1.0.0 and < 2.0.0"

[dependencies]
gleam_erlang = ">= 1.3.0 and < 2.0.0"
gleam_otp = ">= 1.3.0 and < 2.0.0"
sqlite = ">= 2.0.0 and < 3.0.0"
gleam_stdlib = ">= 1.2.0 and < 2.0.0"
pog = ">= 4.1.0 and < 5.0.0"
